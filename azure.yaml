# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: sycom-learn

# infra/main.bicep is resource-group scoped, so AZURE_RESOURCE_GROUP must be set
# in the azd environment. See .azure/deployment-plan.md section 6b.
infra:
  provider: bicep
  path: infra

services:
  dashboard:
    project: .
    host: containerapp
    # The Dockerfile owns the whole build (bun install + vite build), so azd runs
    # no language-specific build step of its own.
    language: docker
    docker:
      path: apps/dashboard/Dockerfile
      context: .
      # Built by ACR Tasks rather than locally: the dev machine is arm64 and
      # Container Apps runs amd64.
      remoteBuild: true

hooks:
  # azd does not create the ACR/managed-identity link itself, so the first
  # revision pointing at an ACR image fails to pull. See scripts/predeploy.sh.
  predeploy:
    posix:
      shell: sh
      run: ./scripts/predeploy.sh
      interactive: true
      continueOnError: false

  # Migrations run inside the VNet via a Container Apps job, because Postgres has
  # no public endpoint. See scripts/postdeploy.sh.
  postdeploy:
    posix:
      shell: sh
      run: ./scripts/postdeploy.sh
      interactive: true
      continueOnError: false
